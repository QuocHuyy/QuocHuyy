<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Uni;src:url(file:///usr/share/fonts/opentype/unifont/unifont.otf)}
@font-face{font-family:UniJP;src:url(file:///usr/share/fonts/opentype/unifont/unifont_jp.otf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ============ setup ============
const W=1080,H=1920,LS=4,LW=W/LS,LH=H/LS;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const C=document.getElementById('c'),X=C.getContext('2d');
const buf=mk(W,H),B=buf.getContext('2d');
const lo=mk(LW,LH),L=lo.getContext('2d');
const rC=mk(W,H),R=rC.getContext('2d'),cC=mk(W,H),CY=cC.getContext('2d');
[X,B,L,R,CY].forEach(c=>c.imageSmoothingEnabled=false);

const P={bg:'#07061a',navy:'#141238',deep:'#1d1850',grid:'#2a2470',purple:'#6b4bd8',violet:'#a98bff',
  cyan:'#5ee8ff',ice:'#d4f8ff',white:'#ffffff',pink:'#e8457e',red:'#ff3355',blue:'#2f7bff',gold:'#ffd166',shadow:'#2a1f66',dark:'#0d0b26'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lin=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), ei=x=>x*x*x, eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hex=(h)=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(h,a)=>{const[r,g,b]=hex(h);return`rgba(${r},${g},${b},${a})`};
const typed=(s,lt,t0,cps)=>s.slice(0,Math.max(0,Math.floor((lt-t0)*cps)));

// ============ pixel text ============
const TC=new Map();
function ptext(str,o={}){
  const key=str+'|'+JSON.stringify(o); if(TC.has(key))return TC.get(key);
  const font=o.font||'Uni',s=o.scale||4,ex=o.extrude||0,ol=o.outline?1:0;
  const m=mk(4,4).getContext('2d'); m.font=`16px ${font}`;
  const tw=Math.max(1,Math.ceil(m.measureText(str).width))+2,th=20;
  const g=mk(tw,th),gx=g.getContext('2d');gx.font=m.font;gx.textBaseline='top';gx.fillStyle='#fff';gx.fillText(str,0,2);
  const d=gx.getImageData(0,0,tw,th).data;
  let mask=new Uint8Array(tw*th);
  for(let i=0;i<tw*th;i++)mask[i]=d[i*4+3]>110?1:0;
  const bw=tw+(o.bold?1:0);
  if(o.bold){const m2=new Uint8Array(bw*th);for(let y=0;y<th;y++)for(let x=0;x<tw;x++)if(mask[y*tw+x]){m2[y*bw+x]=1;m2[y*bw+x+1]=1}mask=m2}
  // bbox
  let x0=bw,x1=-1,y0=th,y1=-1;
  for(let y=0;y<th;y++)for(let x=0;x<bw;x++)if(mask[y*bw+x]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  if(x1<0){x0=0;x1=0;y0=0;y1=0}
  // use font-metric based vertical box so lines align: always rows 2..18
  y0=Math.min(y0,4);y1=Math.max(y1,15);
  const pad=ex+ol+1, ow=x1-x0+1+pad*2, oh=y1-y0+1+pad*2;
  const sm=mk(ow,oh),sx=sm.getContext('2d'),id=sx.createImageData(ow,oh),od=id.data;
  const at=(x,y)=>{x+=x0-pad;y+=y0-pad;return x>=0&&y>=0&&x<bw&&y<th&&mask[y*bw+x]};
  const put=(x,y,c,a=255)=>{const i=(y*ow+x)*4;od[i]=c[0];od[i+1]=c[1];od[i+2]=c[2];od[i+3]=a};
  const grad=(o.grad||[o.color||P.white]).map(hex);
  const sh=hex(o.shadow||P.shadow), oc=hex(o.outline||'#000');
  for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){
    if(at(x,y)){const f=clamp((y-pad)/Math.max(1,(y1-y0)));put(x,y,grad[Math.min(grad.length-1,Math.floor(f*grad.length))]);continue}
    let done=false;
    for(let k=1;k<=ex&&!done;k++)if(at(x-k,y-k)){put(x,y,sh);done=true}
    if(!done&&ol){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]])if(at(x+dx,y+dy)){put(x,y,oc);break}}
  }
  sx.putImageData(id,0,0);
  const big=mk(ow*s,oh*s),bx=big.getContext('2d');bx.imageSmoothingEnabled=false;bx.drawImage(sm,0,0,ow*s,oh*s);
  big._pad=pad*s; TC.set(key,big); return big;
}
// draw text: align c/l/r at x, y = top of glyph box
function T(ctx,str,x,y,o={}){
  if(!str)return 0;
  const img=ptext(str,o.st||{}),sc=o.sc||1,a=o.a===undefined?1:o.a;
  if(a<=0)return img.width;
  const w=img.width*sc,h=img.height*sc;
  let dx=x-(o.align==='l'?img._pad*sc:o.align==='r'?w-img._pad*sc:w/2);
  const dy=o.mid?y-h/2:y-img._pad*sc;
  ctx.save();ctx.globalAlpha=a;ctx.imageSmoothingEnabled=false;
  if(o.rot){ctx.translate(x,y);ctx.rotate(o.rot);ctx.drawImage(img,-w/2,-h/2,w,h)}
  else ctx.drawImage(img,Math.round(dx),Math.round(dy),Math.round(w),Math.round(h));
  ctx.restore();return w-img._pad*sc*2;
}
const tw=(str,st)=>{const i=ptext(str,st);return i.width-i._pad*2};

// ============ assets ============
const heroCity=new Image();heroCity.src='hero_city.png';
const STARS=(()=>{const r=rng(7),a=[];const cols=[P.white,P.ice,P.violet,P.cyan,P.white];
  for(let i=0;i<320;i++)a.push({x:r()*LW,y:r()*LH,z:r(),ph:r()*6.28,c:cols[i%5],big:r()<.06,ang:r()*6.283,r0:r()*330});return a})();

// scanlines + vignette overlays
const scan=mk(W,H);{const s=scan.getContext('2d');s.fillStyle='rgba(0,0,0,0.16)';for(let y=0;y<H;y+=6)s.fillRect(0,y,W,2);
  const g=s.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.6)');s.fillStyle=g;s.fillRect(0,0,W,H);}

// ============ low-res fx ============
function px(x,y,c,a=1,s=1){L.globalAlpha=a;L.fillStyle=c;L.fillRect(Math.round(x),Math.round(y),s,s);L.globalAlpha=1}
function stars(t,a=1,dy=0){for(const s of STARS){const tw=Math.sin(t*4+s.ph*3)>0.2?1:0.35;const y=((s.y+dy*(0.3+s.z))%LH+LH)%LH;
  px(s.x,y,s.c,a*tw*(0.35+0.65*s.z));if(s.big&&tw>0.5){px(s.x-1,y,s.c,a*.6);px(s.x+1,y,s.c,a*.6);px(s.x,y-1,s.c,a*.6);px(s.x,y+1,s.c,a*.6)}}}
function warp(t,speed,cx,cy,a=1){for(const s of STARS){const v=(0.4+s.z)*speed;const r=(s.r0+t*v*40)%330;const ca=Math.cos(s.ang),sa=Math.sin(s.ang);
  const len=Math.min(r*0.6,1+v*1.2);for(let k=0;k<len;k++){px(cx+ca*(r-k),cy+sa*(r-k),s.c,a*(1-k/len)*(0.3+0.7*Math.min(1,r/40)))}}}
function glow(cx,cy,r,col,a){const g=L.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));L.fillStyle=g;L.fillRect(cx-r,cy-r,r*2,r*2)}
function disc(cx,cy,r,col){L.fillStyle=col;const r2=r*r;for(let y=Math.floor(-r);y<=r;y++){const w=Math.floor(Math.sqrt(Math.max(0,r2-y*y)));L.fillRect(Math.round(cx-w),Math.round(cy+y),w*2+1,1)}}
function ring(cx,cy,r,col,a=1,th=1,jit=0,t=0){const n=Math.max(24,Math.floor(r*6.3));for(let i=0;i<n;i++){const an=i/n*6.283;const rr=r+(jit?Math.sin(an*7+t*11)*jit+Math.sin(an*13-t*7)*jit*.6:0);
  for(let k=0;k<th;k++)px(cx+Math.cos(an)*(rr+k),cy+Math.sin(an)*(rr+k),col,a)}}
function voidHole(cx,cy,r,t){
  glow(cx,cy,r*2.6+8,P.purple,.55);glow(cx,cy,r*1.7+4,P.cyan,.45);
  disc(cx,cy,r,'#020108');
  const rr=rng(99);const nst=Math.min(900,70+Math.floor(r*r*0.02));for(let i=0;i<nst;i++){const d=Math.sqrt(rr())*r*0.92,an=rr()*6.283+t*(0.3+rr()*.6);const x=cx+Math.cos(an)*d,y=cy+Math.sin(an)*d;
    px(x,y,i%3?P.ice:P.violet,(Math.sin(t*6+i)>0?1:.4)*clamp(r/6))}
  ring(cx,cy,r,P.white,1,1,1.2,t);ring(cx,cy,r+1,P.cyan,1,2,1.2,t);ring(cx,cy,r+3,P.purple,.8,1,1.6,t);
}
function orb(cx,cy,r,col,t,seed,core=.62){
  glow(cx,cy,r*4,col,.55);glow(cx,cy,r*2,col,.8);disc(cx,cy,r,col);disc(cx,cy,r*core,'#ffffff');
  const rr=rng(seed+Math.floor(t*20));for(let i=0;i<22;i++){const an=rr()*6.283,d=r*(1.1+rr()*1.3);px(cx+Math.cos(an)*d,cy+Math.sin(an)*d,i%2?'#fff':col,1,rr()<.3?2:1)}
}
function flushLo(a=1){B.save();B.globalAlpha=a;B.imageSmoothingEnabled=false;B.drawImage(lo,0,0,W,H);B.restore();L.clearRect(0,0,LW,LH)}

// ============ helpers ============
function impact(fx,lt,t0,p=1){if(lt<t0)return;const d=lt-t0;const k=Math.exp(-d*9);fx.shake=Math.max(fx.shake,26*p*k);fx.rgb=Math.max(fx.rgb,22*p*k);fx.flash=Math.max(fx.flash,.55*p*Math.exp(-d*14))}
const slamS=(lt,t0)=>1+1.6*(1-eo(lin(lt,t0,t0+0.16)));
const slamA=(lt,t0)=>lin(lt,t0,t0+0.05);
const kick=(t)=>Math.exp(-((t*2)%1)*7);
function box(x,y,w,h,border,fill,bw=6){B.fillStyle=border;B.fillRect(x,y,w,h);B.fillStyle=fill;B.fillRect(x+bw,y+bw,w-bw*2,h-bw*2)}
function pixPanel(x,y,w,h,col,a=1){B.save();B.globalAlpha=a;
  B.fillStyle=P.dark;B.fillRect(x+6,y+6,w-12,h-12);
  B.fillStyle=col;B.fillRect(x+12,y,w-24,6);B.fillRect(x+12,y+h-6,w-24,6);B.fillRect(x,y+12,6,h-24);B.fillRect(x+w-6,y+12,6,h-24);
  B.fillRect(x+6,y+6,6,6);B.fillRect(x+w-12,y+6,6,6);B.fillRect(x+6,y+h-12,6,6);B.fillRect(x+w-12,y+h-12,6,6);B.restore()}
const ST={
  title:{bold:1,scale:14,grad:[P.white,P.ice,P.cyan,P.cyan,'#4aa8ff',P.blue],extrude:2,shadow:P.shadow,outline:P.dark},
};

// ============ SCENE 1: terminal boot (0-2.5) ============
function s1(t,fx){
  B.fillStyle='#04030c';B.fillRect(0,0,W,H);
  stars(t,.35);flushLo();
  const x=80,y=620,w=920,h=640;
  const a=eo(lin(t,0,.25));
  pixPanel(x,y,w,h,P.purple,a);
  B.save();B.globalAlpha=a;B.fillStyle=P.purple;B.fillRect(x+6,y+6,w-12,62);
  [[P.red],[P.gold],['#3ddc84']].forEach((c,i)=>{B.fillStyle=c[0];B.fillRect(x+34+i*44,y+24,24,24)});B.restore();
  T(B,'~/QuocHuyy — zsh',x+w/2,y+20,{st:{scale:3,color:P.ice},a});
  const st={scale:4,color:P.cyan},lx=x+44;let ly=y+120;
  const lines=[
    {s:'> open github.com/QuocHuyy',t0:.2,cps:34,st},
    {s:'> scanning cursed energy...',t0:1.0,cps:60,st:{scale:4,color:P.violet}},
    {s:'> WARNING: SPECIAL GRADE',t0:1.5,cps:999,st:{scale:4,color:P.red,bold:1}},
  ];
  let cur=null;
  for(const l of lines){if(t>=l.t0){const s=typed(l.s,t,l.t0,l.cps);const blink=l.st.color===P.red?(Math.floor(t*8)%2?1:.35):1;
    const ww=T(B,s,lx,ly,{st:l.st,align:'l',a:blink});cur=[lx+ww+6,ly]}ly+=96}
  if(t>=1.7){const f=eio(lin(t,1.7,2.3)),n=Math.floor(f*12);
    T(B,'['+'#'.repeat(n)+'.'.repeat(12-n)+'] '+String(Math.floor(f*100)).padStart(3)+'%',lx,ly,{st:{scale:4,color:P.gold},align:'l'});cur=null}
  if(cur&&Math.floor(t*4)%2===0){B.fillStyle=P.cyan;B.fillRect(cur[0],cur[1]+4,26,52)}
  // build-up
  const b=lin(t,1.9,2.5);fx.shake=Math.max(fx.shake,b*b*16);fx.rgb=Math.max(fx.rgb,b*b*18);fx.glitch=Math.max(fx.glitch,b>0.4&&Math.floor(t*30)%3===0?b:0);
  if(t>2.2&&Math.floor(t*30)%2===0){T(B,'領域展開',W/2,H/2,{st:{font:'UniJP',scale:14,color:P.white,outline:P.cyan},mid:1,a:.85})}
  impact(fx,t,0.0,.4);
}

// ============ SCENE 2: domain expansion (2.5-5.5) ============
function s2(lt,fx,t){
  B.fillStyle=P.bg;B.fillRect(0,0,W,H);
  const swallow=eio(lin(lt,2.15,3.0));
  // city
  const z=1+0.07*lt+swallow*0.4,cw=360*3*z,ch=320*3*z;
  B.save();B.imageSmoothingEnabled=false;B.globalAlpha=1-swallow*.6;
  B.drawImage(heroCity,480,0,360,320,W/2-cw/2,H-ch-40*(1-swallow),cw,ch);B.restore();
  // fade top edge of city into bg
  const g=B.createLinearGradient(0,H-ch-40,0,H-ch+260);g.addColorStop(0,P.bg);g.addColorStop(1,'rgba(7,6,26,0)');B.fillStyle=g;B.fillRect(0,0,W,H-ch+260);
  stars(t,.8,-lt*6);
  // void
  const cx=LW/2,cy=215;
  const crack=lin(lt,0.05,0.3),open=eback(lin(lt,0.25,0.9));
  let r=open*34+Math.sin(lt*10)*0.6*open;
  r+=swallow*420;
  if(crack>0&&open<0.05){const hgt=crack*70;for(let y=-hgt;y<hgt;y++){const xo=Math.sin(y*.7+lt*30)*1.5;px(cx+xo,cy+y,P.white);px(cx+xo+1,cy+y,P.cyan,.8);px(cx+xo-1,cy+y,P.violet,.6)}glow(cx,cy,30,P.cyan,.6)}
  if(open>0){
    // particles sucked in
    const rr=rng(5);for(let i=0;i<140;i++){const ph=(rr()+lt*(0.5+rr()))%1,an=rr()*6.283+ph*2.5,d=(1-ph)*170+r;
      px(cx+Math.cos(an)*d,cy+Math.sin(an)*d*0.9,i%3?P.cyan:P.violet,ph)}
    voidHole(cx,cy,r,lt);
  }
  flushLo();
  // text
  const ta=1-lin(lt,2.15,2.6);
  const ts=1-swallow*.5;
  if(lt>=0.5){const s=slamS(lt,.5)*ts;T(B,'DOMAIN',W/2,300+swallow*300,{st:{...ST.title,scale:14},sc:s,a:slamA(lt,.5)*ta,mid:1});impact(fx,lt,.5,1)}
  if(lt>=1.0){const s=slamS(lt,1.0)*ts;T(B,'EXPANSION',W/2,470+swallow*200,{st:{...ST.title,scale:11,grad:[P.white,'#ffd2ec',P.pink,P.pink,'#b8336e'],shadow:'#3a1030'},sc:s,a:slamA(lt,1.0)*ta,mid:1});impact(fx,lt,1.0,1)}
  if(lt>=1.6){T(B,typed('// UNLIMITED VOID',lt,1.6,26),W/2-tw('// UNLIMITED VOID',{scale:4,color:P.ice})/2,600,{st:{scale:4,color:P.ice},align:'l',a:ta})}
  const kj=lin(lt,1.6,1.9);if(kj>0)T(B,'無量空処',W/2,1080+swallow*-100,{st:{font:'UniJP',scale:8,color:P.ice,outline:P.dark,extrude:1,shadow:P.purple},a:kj*ta*(0.75+0.25*kick(t)),mid:1});
  if(swallow>0){fx.shake=Math.max(fx.shake,swallow*14);fx.rgb=Math.max(fx.rgb,swallow*10)}
  fx.flash=Math.max(fx.flash,1-lin(lt,0,.3));fx.zoom+=0.012*kick(t);
}

// ============ SCENE 3: name reveal (5.5-8.5) ============
function s3(lt,fx,t){
  B.fillStyle='#020108';B.fillRect(0,0,W,H);
  const cx=LW/2,cy=215;
  glow(cx,cy,260,P.purple,.35);glow(cx,cy,120,P.blue,.25);
  const sp=8*Math.exp(-lt*2.2)+0.7;warp(lt*1+ (1-Math.exp(-lt*2.2))*3,sp,cx,cy,1);
  // orbit ring of particles
  const rr=rng(3);for(let i=0;i<90;i++){const an=rr()*6.283+lt*(0.6+rr()*.5),rad=95+rr()*14;px(cx+Math.cos(an)*rad,cy+Math.sin(an)*rad*.32-6,i%2?P.cyan:P.violet,.8)}
  flushLo();
  const k=kick(t);
  if(lt>=0){T(B,'QUOC',W/2,620,{st:{...ST.title,scale:20},sc:slamS(lt,0.02)*(1+0.012*k),a:slamA(lt,0.02),mid:1});impact(fx,lt,0.02,1.1)}
  if(lt>=0.5){T(B,'HUY',W/2,920,{st:{...ST.title,scale:20},sc:slamS(lt,.5)*(1+0.012*k),a:slamA(lt,.5),mid:1});impact(fx,lt,.5,1.1)}
  if(lt>=1.0){const s=eback(lin(lt,1.0,1.25));const lab='AI ENGINEER',st={scale:6,bold:1,color:P.white};const w=tw(lab,st)+70,h=130;
    B.save();B.translate(W/2,1170);B.scale(s,s);B.fillStyle='#7a1f47';B.fillRect(-w/2+8,-h/2+8,w,h);B.fillStyle=P.pink;B.fillRect(-w/2,-h/2,w,h);
    B.fillStyle='#ff8fb8';B.fillRect(-w/2,-h/2,w,8);T(B,lab,0,0,{st,mid:1});B.restore();impact(fx,lt,1.0,.5)}
  if(lt>=1.5){const s=typed('HO CHI MINH CITY, VIET NAM',lt,1.5,40);const st={scale:4,color:P.ice};const full=tw('HO CHI MINH CITY, VIET NAM',st)+56;const x0=W/2-full/2;
    // pixel pin
    const pp=[[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[4,1],[0,2],[1,2],[3,2],[4,2],[0,3],[1,3],[2,3],[3,3],[4,3],[1,4],[2,4],[3,4],[2,5],[2,6]];
    B.fillStyle=P.pink;for(const[a,b]of pp)B.fillRect(x0+a*8,1300+b*8,8,8);
    T(B,s,x0+56,1294,{st,align:'l'})}
  if(lt>=2.0){const s=typed('> HELLO, WORLD',lt,2.0,30);const st={scale:4,color:P.cyan};const ww=T(B,s,W/2-tw('> HELLO, WORLD_',st)/2,1400,{st,align:'l'});
    if(Math.floor(lt*4)%2===0){B.fillStyle=P.cyan;B.fillRect(W/2-tw('> HELLO, WORLD_',st)/2+ww+6,1404,26,52)}}
  fx.zoom+=0.01*k;
}

// ============ SCENE 4: sorcerer file (8.5-11.5) ============
function s4(lt,fx,t){
  B.fillStyle=P.bg;B.fillRect(0,0,W,H);
  // moving grid
  B.fillStyle=rgba(P.grid,.35);const off=(lt*60)%60;for(let x=0;x<W;x+=60)B.fillRect(x,0,2,H);for(let y=-60+off;y<H;y+=60)B.fillRect(0,y,W,2);
  stars(t,.6,lt*20);flushLo();
  const pa=eo(lin(lt,0,.25)),py=330+(1-pa)*160,px0=70,pw=940,ph=1130;
  pixPanel(px0,py,pw,ph,P.cyan,pa);
  B.save();B.globalAlpha=pa;B.fillStyle=P.pink;B.fillRect(px0+6,py+6,pw-12,96);B.fillStyle='#ff8fb8';B.fillRect(px0+6,py+6,pw-12,6);B.restore();
  T(B,'SORCERER FILE',px0+44,py+54,{st:{scale:5,bold:1,color:P.white},align:'l',mid:1,a:pa});
